<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>onholdlab 等候空間</title>
<meta name="description" content="onholdlab 等候空間：一個人用 AI 把想法做成作品的地方。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;900&family=Poppins:wght@500;600;700&display=swap">
<style>
/* 版面:頂部窗口+鈴 → 拱形舞台(桌寵打廣告)→ 最新資訊 → 三欄(提問/列表/展示),手機單欄。
   三個方向各自是固定的一個世界,不跟隨系統深淺色;每個方向的顏色都寫在自己的 token 裡。 */
:root{
  --bg:#d7e7df;--ink:#12302a;--muted:#3d5a52;--panel:#eef5f1;--line:#12302a;--accent:#c2281d;--on-accent:#ffffff;
  --stage-bg:#bcd8cb;--ad-bg:#ffe45c;--ad-ink:#1a1a1a;--ad-bar:#c2281d;--art:#12302a;--hit:#c2281d;
  --cb:#f4a259;--cd:#e08a2e;--cbelly:#fff1dc;--cstroke:none;
  --f-disp:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  --f-body:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;
  --f-num:"Inter","Noto Sans TC",system-ui,sans-serif;
  color-scheme:light;
}
/* A 叫號候診:醫院候診室的薄荷綠磁磚、紅色 LED 叫號、黃色俗豔廣告 */
:root[data-d="a"]{}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:400 16px/1.6 var(--f-body);overflow-x:hidden}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px;display:grid;gap:22px;position:relative}

/* ---------- 頂部:品牌、窗口、鈴 ---------- */
.top{display:grid;grid-template-columns:1fr auto 1fr;align-items:end;gap:12px}
.brand{font:700 15px/1.2 var(--f-num);letter-spacing:.02em;align-self:start;padding-top:6px}
.brand small{display:block;font:500 12px/1.4 var(--f-body);color:var(--muted);letter-spacing:0}
.language{position:relative;width:max-content;max-width:100%;margin-top:8px;z-index:10;font:500 14px/1.3 var(--f-body);letter-spacing:0}
.lang{display:flex;align-items:center;gap:10px;min-height:44px;padding:8px 12px;border:2px solid var(--line);background:var(--panel);box-shadow:3px 3px 0 var(--line);cursor:pointer;list-style:none;font-weight:700}
.lang::-webkit-details-marker{display:none}
.lang::before{content:"L";font:700 13px/1 var(--f-num);color:var(--muted)}
.lang::after{content:"";width:7px;height:7px;margin-left:8px;border-right:2px solid;border-bottom:2px solid;transform:translateY(-2px) rotate(45deg)}
.language[open] .lang::after{transform:translateY(2px) rotate(225deg)}
.lang:hover,.lang-options button:hover{background:var(--stage-bg)}
.lang-options{position:absolute;top:calc(100% + 8px);left:0;min-width:190px;max-width:calc(100vw - 48px);max-height:min(360px,60dvh);overflow-y:auto;padding:4px;border:2px solid var(--line);background:var(--panel);box-shadow:4px 4px 0 var(--line)}
.lang-options button{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;border:0;background:transparent;text-align:left;padding:8px 10px;cursor:pointer}
.lang-options button::before{content:"";width:7px;height:7px;flex:none;border:1px solid var(--line);border-radius:50%}
.lang-options button[aria-pressed="true"]{font-weight:700;background:var(--stage-bg)}
.lang-options button[aria-pressed="true"]::before{background:var(--accent);border-color:var(--accent)}
.winbox{display:flex;align-items:flex-end;gap:10px}
.win{position:relative;width:180px;height:92px;overflow:hidden;border:3px solid var(--line);background:var(--panel);display:grid;place-items:center;text-align:center}
.win .in{display:grid;gap:2px;padding:6px}
.win .lab{font:500 12px/1.2 var(--f-body);color:var(--muted)}
.win .num{display:none}
.win{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.win .lab.say{color:#fff;font-weight:700;white-space:pre-line;line-height:1.35}
.win a{font:700 15px/1.3 var(--f-disp);text-decoration:none;min-height:44px;display:grid;place-items:center;padding:0 8px}
.win a:hover{text-decoration:underline}
.shutter{position:absolute;inset:0;transition:transform .55s cubic-bezier(.3,.7,.2,1);background:repeating-linear-gradient(var(--line) 0 2px,var(--panel) 2px 11px);opacity:.92}
.win.open .shutter{transform:translateY(-100%)}
.sh-l{position:absolute;right:8px;bottom:6px;font:700 12px/1 var(--f-body);background:var(--panel);color:var(--ink);padding:4px 7px}
.bell{width:56px;height:56px;border:0;background:none;cursor:pointer;padding:0;display:grid;place-items:end center}
.bell svg{width:52px;height:46px;overflow:visible}
.bell.ring svg{animation:ring .5s ease-out}
@keyframes ring{20%{transform:rotate(-14deg)}45%{transform:rotate(11deg)}70%{transform:rotate(-6deg)}}

/* ---------- 舞台 ---------- */
.stage{position:relative;height:420px;background:var(--stage-bg);overflow:hidden;isolation:isolate;touch-action:manipulation}
.deco{position:absolute;inset:0;z-index:-1;pointer-events:none}
.deco>*{display:none}
.play-area{min-width:0;display:grid;gap:12px}
.stage-info{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 20px;min-height:36px}
.hud{margin-left:auto;font:800 28px/1 var(--f-num);font-variant-numeric:tabular-nums;display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--accent)}
.hud small{font:500 12px/1.4 var(--f-body)}
.hint{flex:1 1 240px;margin:0;font:500 14px/1.5 var(--f-body);color:var(--muted);overflow-wrap:anywhere}
.ad{position:absolute;display:grid;grid-template-rows:22px 1fr;width:220px;min-height:118px;border:2px solid var(--ad-ink);background:var(--ad-bg);color:var(--ad-ink);padding:0;cursor:pointer;text-align:left;z-index:2;box-shadow:5px 5px 0 var(--ad-ink);transition:opacity .25s}
.ad .bar{background:var(--ad-bar);display:flex;justify-content:flex-end;align-items:center;padding:0 6px;gap:5px}
.ad .bar i{width:9px;height:9px;border-radius:50%;background:var(--ad-bg);display:block}
.ad b{display:block;padding:8px 12px;font:900 18px/1.25 var(--f-disp);text-wrap:balance;overflow-wrap:anywhere}
.ad.tgt{outline:3px dashed var(--hit);outline-offset:4px}
.ad.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.ad.hit{background:transparent;box-shadow:none;color:transparent}
.ad.hit .bar{background:transparent;border-bottom:2px solid var(--ad-ink)}
.ad.hit .bar i{background:transparent;border:2px solid var(--ad-ink)}
.cat{position:absolute;left:0;top:0;width:96px;height:106px;z-index:4;pointer-events:none;will-change:transform}
.cat .face{transform-origin:48px 60px}
.cat svg{display:block;overflow:visible;width:96px;height:106px}
.cat svg *{transform-box:view-box}
.cat .tail{transform-origin:28px 80px;animation:tail .6s infinite ease-in-out alternate}
.cat.run .bob{animation:bob .26s infinite ease-in-out}
.cat.run .legf{transform-origin:60px 90px;animation:leg .26s infinite}
.cat.run .legb{transform-origin:38px 90px;animation:leg .26s infinite reverse}
.cat .arm{transform-origin:65px 64px}
.cat.punch .arm{animation:punch .42s forwards cubic-bezier(.2,.8,.2,1)}
.cat.punch .bob{animation:jump .42s forwards}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-8px) rotate(4deg)}}
@keyframes leg{0%,100%{transform:rotate(28deg)}50%{transform:rotate(-28deg)}}
@keyframes tail{from{transform:rotate(-14deg)}to{transform:rotate(14deg)}}
@keyframes punch{30%{transform:rotate(35deg)}100%{transform:rotate(-170deg)}}
@keyframes jump{30%{transform:translateY(4px)}100%{transform:translateY(-22px)}}
.fx{position:absolute;inset:0;pointer-events:none;z-index:5}
.ringfx{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:5px solid var(--hit);border-radius:50%}
.spark{position:absolute;width:10px;height:10px;margin:-5px 0 0 -5px;background:var(--hit);border:2px solid var(--ad-ink)}
.ghost{position:absolute;border:2px solid var(--art);pointer-events:none;z-index:20;transform-origin:0 0}
.ghost::before{content:"";position:absolute;left:0;right:0;top:20px;border-top:2px solid var(--art)}

/* ---------- 最新資訊 + 三欄 ---------- */
.news-h{margin:0;text-align:center;font:900 26px/1.2 var(--f-disp);text-wrap:balance;padding-bottom:10px;border-bottom:2px solid var(--line)}
.low{display:grid;grid-template-columns:1fr 1.25fr 1fr;grid-template-areas:"ask news show";gap:28px;align-items:start}
.low>*{min-width:0}
.ask{grid-area:ask;display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
.qform{grid-template-columns:minmax(0,1fr)}
.news{grid-area:news;list-style:none;margin:0;padding:0;display:grid}
.show{grid-area:show;margin:0;display:grid;gap:6px}
.h3{font:700 14px/1.3 var(--f-body);color:var(--muted);margin:0}
.news li a{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;min-height:56px;padding:8px 2px;text-decoration:none;border-bottom:1px solid var(--line)}
.news li a:hover .t{text-decoration:underline}
.news .k{font:700 12px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--muted)}
.news .t{font:700 17px/1.3 var(--f-disp);overflow-wrap:anywhere}
.news .t small{display:block;font:400 13px/1.4 var(--f-body);color:var(--muted)}
.news .ty{font:500 12px/1 var(--f-body);border:1px solid var(--line);padding:4px 7px}
.news .old{font:500 12px/1.4 var(--f-body);color:var(--muted);text-align:center;padding-top:8px;border:0}
.faq{display:flex;flex-wrap:wrap;gap:8px}
.faq button{min-height:44px;padding:8px 12px;border:2px solid var(--line);background:var(--panel);cursor:pointer;font:500 14px/1.3 var(--f-body)}
.faq button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.ans{min-height:52px;font:400 15px/1.6 var(--f-body);margin:0}
.qrow{display:flex;align-items:center;gap:8px;border-bottom:2px solid var(--line)}
.qrow input{flex:1;min-width:0;min-height:44px;border:0;background:transparent;font:500 16px/1.4 var(--f-body);color:var(--ink);padding:0}
.qrow input::placeholder{color:var(--muted);opacity:1}
.qrow input:focus{outline:none}
.qrow:focus-within{border-bottom-color:var(--accent)}
.qform{display:grid;gap:10px}
.qrow button{min-height:44px;min-width:56px;border:0;cursor:pointer;font:700 15px/1 var(--f-body);background:var(--accent);color:var(--on-accent);padding:0 14px}
.qrow button:disabled{opacity:.6;cursor:wait}
.qrow.sub{border-bottom-width:1px}
.qrow.sub input{font-size:14px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.qnote a{text-underline-offset:3px}
.qnote{font:400 14px/1.5 var(--f-body);color:var(--muted);min-height:21px;margin:0}
.qnote.ok{color:var(--ink);font-weight:700}
.contact{display:flex;flex-wrap:wrap;gap:6px 14px}
.contact a{min-height:44px;display:inline-grid;place-items:center;font:700 14px/1 var(--f-num);text-underline-offset:4px}
.show svg{width:100%;height:auto;display:block;border:2px solid var(--line);background:var(--panel);aspect-ratio:3/2;max-width:100%}
.artw{position:relative}
.empty{position:absolute;inset:0;display:grid;place-items:center;margin:0;padding:16px;text-align:center;font:500 14px/1.5 var(--f-body);color:var(--muted);pointer-events:none}
.show figcaption{font:400 13px/1.4 var(--f-body);color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.show figcaption b{font:800 16px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;gap:6px 18px;justify-content:center;align-items:center;font:500 13px/1.4 var(--f-body);color:var(--muted);padding-top:18px;border-top:1px solid var(--line)}
.foot a{min-height:44px;display:inline-grid;place-items:center;text-underline-offset:4px}
.show button{border:0;background:none;text-decoration:underline;cursor:pointer;min-height:44px;color:var(--muted);font-size:13px;padding:0}

/* ================= A 叫號候診 ================= */
[data-d="a"] .stage{border-radius:46% 46% 0 0/18% 18% 0 0;border:3px solid var(--line);border-bottom:0;
  background:linear-gradient(transparent 76%,#9fbfb2 76%),
    repeating-linear-gradient(90deg,transparent 0 47px,rgba(18,48,42,.13) 47px 49px),
    repeating-linear-gradient(transparent 0 47px,rgba(18,48,42,.13) 47px 49px),var(--stage-bg)}
[data-d="a"] .deco .a{display:block;position:absolute;left:0;right:0;bottom:0;height:24%;
  background:radial-gradient(circle at 20% 30%,#5f7d72 1.5px,transparent 2px) 0 0/23px 19px,radial-gradient(circle at 60% 70%,#e9f2ee 1.5px,transparent 2px) 0 0/31px 27px,radial-gradient(circle at 40% 50%,#c2281d 1.2px,transparent 1.8px) 0 0/43px 37px}
[data-d="a"] .win{height:118px;background:#151a18;border-color:#151a18;border-radius:6px;box-shadow:0 0 0 4px #9aa8a2}
[data-d="a"] .win .lab{color:#ff9d93}
[data-d="a"] .win a{color:#ffb4ac}
[data-d="a"] .win .num{display:block;border:0;background:none;padding:0;cursor:pointer;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font:800 40px/1 var(--f-num);font-variant-numeric:tabular-nums;color:#ff3b2f;letter-spacing:.06em;
  -webkit-mask:radial-gradient(circle,#000 58%,transparent 62%) 0 0/4px 4px;mask:radial-gradient(circle,#000 58%,transparent 62%) 0 0/4px 4px;text-shadow:0 0 10px #ff3b2f}
[data-d="a"] .shutter{background:repeating-linear-gradient(#2b302e 0 2px,#4a524f 2px 10px)}
[data-d="a"] .news-h{font-weight:900;letter-spacing:.04em}
[data-d="a"] .shutter{display:none}
[data-d="a"] .win.blink .num{animation:blink .18s steps(2) 4}
@keyframes blink{50%{opacity:.15}}
[data-d="a"] .ad{box-shadow:5px 5px 0 #12302a}
[data-d="a"] .ad:nth-child(3n+2){--ad-bg:#ff7a59}
[data-d="a"] .ad:nth-child(3n){--ad-bg:#ffffff;--ad-bar:#1f6fd6}

@media (min-width:761px) and (max-width:1023px){
  .low{grid-template-columns:1fr 1fr;grid-template-areas:"news news" "ask show"}
}
@media (max-width:760px){
  .top{grid-template-columns:1fr auto}
  .brand{grid-column:1/-1}
  .winbox{grid-column:1/-1;justify-self:center}
  .stage{height:330px}
  .low{grid-template-columns:1fr;grid-template-areas:"news" "show" "ask";gap:26px}
  .ad{width:calc(50% - 20px);min-height:92px;grid-template-rows:18px 1fr}
  .ad b{font-size:15px;padding:5px 8px}
  .hud{font-size:22px}
  .cat,.cat svg{width:76px;height:84px}
  .news-h{font-size:22px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
<script data-goatcounter="https://onholdlab.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
<style id="inapp-keep1">
/* Threads / IG 內建瀏覽器:頁面最少比畫面高 2px,並保持捲到 1px 以上;
   App 就不會在頂端把往下拖當成「關閉瀏覽器面板」。正常上下捲動不受影響。 */
html{min-height:calc(100% + 2px);overscroll-behavior-y:none}
body{min-height:calc(100dvh + 2px)}
</style>
<script id="inapp-keep1-js">
(function(){
  function keep(){ if(window.scrollY<1){ try{window.scrollTo({top:1,behavior:'instant'});}catch(e){window.scrollTo(0,1);} } }
  addEventListener('load',keep); addEventListener('resize',keep);
  addEventListener('scroll',function(){ if(window.scrollY<1) requestAnimationFrame(keep); },{passive:true});
  document.addEventListener('touchstart',keep,{passive:true,capture:true});
  if(document.readyState!=='loading') keep(); else document.addEventListener('DOMContentLoaded',keep);
})();
</script>
</head>
<body>
<div class="wrap">
 <header class="top">
  <div class="brand">onholdlab<small data-i="brandSub">等候空間</small><details class="language" id="language">
   <summary class="lang" id="lang" aria-label="Language"><span id="langLabel">繁體中文</span></summary>
   <div class="lang-options" id="langOptions" role="group" aria-label="Language"></div>
  </details></div>
  <div class="winbox">
   <div class="win" id="win">
    <div class="in"><button class="num" id="num" type="button" data-i-aria="numAria" aria-label="今天有新作嗎?"></button><span class="lab" data-i="latestLab">最新完成</span><a id="latest" href="https://onholdlab.github.io/crossroadhit/" target="_blank" rel="noopener" tabindex="-1">十字路口求生</a></div>
    <div class="shutter" aria-hidden="true"><span class="sh-l" data-i="bellLab">按鈴</span></div>
   </div>
   <button class="bell" id="bell" type="button" aria-label="按鈴,打開窗口看最新作品" data-i-aria="bellAria" aria-expanded="false" aria-controls="win">
    <svg viewBox="0 0 52 46" aria-hidden="true"><ellipse cx="26" cy="42" rx="22" ry="4" fill="var(--line)"/><path d="M6 40C6 16 46 16 46 40Z" fill="var(--accent)" stroke="var(--line)" stroke-width="2.5"/><path d="M13 32c1-7 6-10 11-10" fill="none" stroke="var(--on-accent)" stroke-width="2.5" stroke-linecap="round" opacity=".7"/><rect x="22" y="9" width="8" height="8" rx="2" fill="var(--line)"/></svg>
   </button>
  </div>
 </header>

 <div class="play-area">
  <div class="stage-info">
   <p class="hint" id="hint" data-i="hint">點廣告,貓會幫你打掉</p>
   <div class="hud" aria-live="polite"><small data-i="today">今天打掉</small><span id="cnt">0</span></div>
  </div>
 <section class="stage" id="stage" aria-label="打廣告小遊戲:點廣告,貓會衝過去打掉" data-i-aria="stageAria">
  <div class="deco" aria-hidden="true">
   <div class="a"></div>
     </div>
  <div id="ads"></div>
  <div class="cat" id="cat" aria-hidden="true"><div class="face"><div class="bob">
   <svg viewBox="0 0 100 110">
    <path class="tail" d="M26 82C6 80 4 56 16 50" fill="none" stroke="var(--cd)" stroke-width="8" stroke-linecap="round"/>
    <rect class="legb" x="33" y="88" width="10" height="18" rx="5" fill="var(--cd)"/>
    <rect class="legf" x="57" y="88" width="10" height="18" rx="5" fill="var(--cd)"/>
    <ellipse cx="48" cy="78" rx="26" ry="19" fill="var(--cb)"/>
    <ellipse cx="52" cy="85" rx="14" ry="10" fill="var(--cbelly)"/>
    <path d="M28 68l6 4M26 76l7 2M30 84l6 0" stroke="var(--cd)" stroke-width="3" stroke-linecap="round"/>
    <g class="arm"><rect x="60" y="62" width="10" height="22" rx="5" fill="var(--cb)"/><circle cx="65" cy="86" r="7.5" fill="var(--cb)" stroke="var(--cd)" stroke-width="2"/></g>
    <g class="head">
     <polygon points="28,26 32,3 50,17" fill="var(--cb)"/><polygon points="76,26 72,3 54,17" fill="var(--cb)"/>
     <polygon points="33,22 35,10 44,17" fill="#ffb3b3"/><polygon points="71,22 69,10 60,17" fill="#ffb3b3"/>
     <circle cx="52" cy="42" r="27" fill="var(--cb)"/>
     <path d="M44 20l2 7M52 18v8M60 20l-2 7" stroke="var(--cd)" stroke-width="3" stroke-linecap="round"/>
     <ellipse cx="42" cy="42" rx="6" ry="7" fill="#fff"/><ellipse cx="63" cy="42" rx="6" ry="7" fill="#fff"/>
     <circle cx="44" cy="43" r="3.2" fill="#222"/><circle cx="65" cy="43" r="3.2" fill="#222"/>
     <path d="M33 31l16 6M72 31l-16 6" stroke="#5a3310" stroke-width="3.5" stroke-linecap="round"/>
     <path d="M49 50h7l-3.5 4z" fill="#e0707a"/>
     <path d="M44 60q8-7 16 0" fill="none" stroke="#5a3310" stroke-width="2.5" stroke-linecap="round"/>
    </g>
   </svg></div></div></div>
  <div class="fx" id="fx"></div>
 </section>
 </div>

 <h2 class="news-h" data-i="newsH">最新資訊</h2>
 <div class="low">
  <div class="ask">

/* ---------- 打廣告 ---------- */
const stage=$('stage'),adsEl=$('ads'),cat=$('cat'),fx=$('fx');
let ads=[],queue=[],adSeq=0,count=0;
let cx=40,cy=0,tx=40,ty=0,mode='idle',busy=null,flip=1,wanderT=0;
const catSize=()=>({w:cat.offsetWidth,h:cat.offsetHeight});
function floorY(){return stage.clientHeight-catSize().h-6}
function layoutCat(){if(!stage)return;cy=ty=floorY()}
function slots(){const W=stage.clientWidth,mobile=matchMedia('(max-width:760px)').matches;
 const elements=[...adsEl.children],aw=elements[0]?elements[0].offsetWidth:220;
 const ah=Math.max(mobile?92:118,...elements.map(e=>e.offsetHeight)),top=mobile?66:74,cols=mobile?2:3,out=[];
 // 廣告依翻譯文字自然長高，兩排保持間距，底部留給貓走動。
 stage.style.height=Math.max(mobile?330:420,top+ah*2+26+catSize().h*.5+12)+'px';
 const bottom=stage.clientHeight-ah-catSize().h*.5-12;
 for(let r=0;r<2;r++)for(let c=0;c<cols;c++)out.push([8+(W-aw-16)*c/(cols-1),r?bottom:top]);
 return out}
function layoutAds(){const sl=slots(),used=new Set();ads.forEach(a=>{
 if(a.slot>=sl.length||used.has(a.slot))a.slot=sl.findIndex((_,i)=>!used.has(i));used.add(a.slot);
 const[x,y]=sl[a.slot];a.el.style.left=x+'px';a.el.style.top=y+'px'});
 const floor=floorY();cy=Math.max(0,Math.min(cy,floor));ty=mode==='idle'?floor:Math.max(0,Math.min(ty,floor))}
function spawn(){if(ads.length>=(matchMedia('(max-width:760px)').matches?3:4))return;
 const used=new Set(ads.map(a=>a.slot)),sl=slots(),free=sl.map((_,i)=>i).filter(i=>!used.has(i));if(!free.length)return;
 const si=free[(Math.random()*free.length)|0],el=document.createElement('button');
 el.type='button';el.className='ad pop';const ai=adSeq++%T.zh.ads.length,txt=t('ads')[ai];
 el.innerHTML=`<span class="bar" aria-hidden="true"><i></i><i></i></span><b>${esc(txt)}</b>`;el.setAttribute('aria-label',t('adAria')+txt);
 adsEl.appendChild(el);
 const a={el,slot:si,born:performance.now(),txt,ai};ads.push(a);layoutAds();
 el.addEventListener('click',()=>target(a));}
function target(a){if(a.dead||queue.includes(a)||busy===a)return;a.el.classList.add('tgt');queue.push(a)}
function impact(a){a.dead=true;const r=a.el.getBoundingClientRect(),s=stage.getBoundingClientRect();
 const x=r.left-s.left+r.width/2,y=r.top-s.top+r.height/2;
 if(!RM){const ring=document.createElement('div');ring.className='ringfx';ring.style.left=x+'px';ring.style.top=y+'px';fx.appendChild(ring);
  ring.animate([{transform:'scale(.2)',opacity:1},{transform:'scale(6)',opacity:0}],{duration:480,easing:'ease-out'}).onfinish=()=>ring.remove();
  for(let i=0;i<12;i++){const p=document.createElement('div');p.className='spark';p.style.left=x+'px';p.style.top=y+'px';fx.appendChild(p);
   const an=i/12*6.283+Math.random()*.4,d=50+Math.random()*70;p.animate([{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${Math.cos(an)*d}px,${Math.sin(an)*d}px) rotate(200deg) scale(.2)`,opacity:0}],{duration:560,easing:'ease-out'}).onfinish=()=>p.remove()}
  stage.animate([{transform:'translate(0,0)'},{transform:'translate(0,5px)'},{transform:'translate(0,-2px)'},{transform:'none'}],{duration:340})}
 a.el.classList.add('hit');a.el.classList.remove('tgt');
 count++;$('cnt').textContent=count;
 setTimeout(()=>toLines(a,r),RM?0:380)}
/* 廣告只剩線條,飛進右邊的展示框,成為一筆線條作品 */
function toLines(a,r){const art=$('art'),ar=art.getBoundingClientRect(),wr=document.querySelector('.wrap').getBoundingClientRect();
 const k=ar.width/300,w=40+Math.random()*50,hh=w*.54,px=10+Math.random()*(280-w),py=10+Math.random()*(180-hh),rot=(Math.random()-.5)*40;
 const rec={x:+px.toFixed(1),y:+py.toFixed(1),w:+w.toFixed(1),h:+hh.toFixed(1),r:+rot.toFixed(1),t:a.txt.length};
 const done=()=>{a.el.remove();ads=ads.filter(z=>z!==a);addArt(rec,true);const L=store.get('ohl_art',[]);L.push(rec);store.set('ohl_art',L.slice(-80))};
 if(RM||!ar.width){done();return}
 const g=document.createElement('div');g.className='ghost';document.querySelector('.wrap').appendChild(g);
 g.style.left=(r.left-wr.left)+'px';g.style.top=(r.top-wr.top)+'px';g.style.width=r.width+'px';g.style.height=r.height+'px';
 a.el.style.opacity=0;
 const tx=ar.left-wr.left+(px+w/2)*k-r.width/2,ty2=ar.top-wr.top+(py+hh/2)*k-r.height/2,sc=w*k/r.width;
 g.animate([{transform:'translate(0,0) rotate(0) scale(1)'},{transform:`translate(${(tx-(r.left-wr.left))*.5}px,${(ty2-(r.top-wr.top))*.5-60}px) rotate(${rot/2}deg) scale(${(1+sc)/2})`,offset:.5},{transform:`translate(${tx-(r.left-wr.left)}px,${ty2-(r.top-wr.top)}px) rotate(${rot}deg) scale(${sc})`}],{duration:900,easing:'cubic-bezier(.5,0,.3,1)'}).onfinish=()=>{g.remove();done()}}
function addArt(o,fresh){const art=$('art'),NS='http://www.w3.org/2000/svg',g=document.createElementNS(NS,'g');
 g.setAttribute('transform',`rotate(${o.r} ${o.x+o.w/2} ${o.y+o.h/2})`);g.setAttribute('fill','none');g.setAttribute('stroke','var(--art)');g.setAttribute('stroke-width','1.4');
 const ln=(x1,y1,x2,y2)=>{const l=document.createElementNS(NS,'line');l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);g.appendChild(l)};
 const{x,y,w,h}=o,bar=h*.19;ln(x,y,x+w,y);ln(x+w,y,x+w,y+h);ln(x+w,y+h,x,y+h);ln(x,y+h,x,y);ln(x,y+bar,x+w,y+bar);
 const lines=1+(o.t>8?1:0);for(let i=0;i<lines;i++)ln(x+w*.12,y+bar+h*(.3+i*.25),x+w*(.5+((o.t*7+i*13)%40)/100),y+bar+h*(.3+i*.25));
 art.appendChild(g);$('artn').textContent=art.childNodes.length;$('empty').hidden=true;
 if(fresh&&!RM)g.animate([{opacity:0},{opacity:1}],{duration:300})}
store.get('ohl_art',[]).forEach(o=>addArt(o,false));
applyLangHooks.push(()=>{ads.forEach(a=>{if(a.dead)return;a.txt=t('ads')[a.ai];a.el.querySelector('b').textContent=a.txt;a.el.setAttribute('aria-label',t('adAria')+a.txt)});layoutAds()});
$('clear').onclick=()=>{$('art').innerHTML='';$('artn').textContent=0;$('empty').hidden=false;store.set('ohl_art',[])};

function tick(now){
 const fy=floorY(),W=stage.clientWidth;
 if(!busy){
  ads.forEach(a=>{if(!a.dead&&!queue.includes(a)&&now-a.born>9000)queue.push(a)});
  while(queue.length&&queue[0].dead)queue.shift();
  if(queue.length){busy=queue.shift();mode='go'}
 }
 if(mode==='go'&&busy){const e=busy.el;tx=Math.max(0,Math.min(W-catSize().w,e.offsetLeft-catSize().w*.55));ty=Math.max(10,Math.min(fy,e.offsetTop+e.offsetHeight-catSize().h*.75));}
 else if(mode==='idle'){if(now>wanderT){wanderT=now+2500+Math.random()*2500;tx=10+Math.random()*(W-catSize().w-20)}ty=fy}
 const k=mode==='go'?0.12:0.035,dx=tx-cx,dy=ty-cy;
 if(RM&&mode==='go'){cx=tx;cy=ty}else{cx+=dx*k;cy+=dy*k}
 const moving=Math.hypot(dx,dy)>2&&mode!=='punch';cat.classList.toggle('run',moving);
 if(Math.abs(dx)>4&&mode!=='punch')flip=dx>0?1:-1;
 cat.firstChild.style.transform=`scaleX(${mode==='punch'?1:flip})`;
 cat.style.transform=`translate(${cx}px,${cy}px)`;
 if(mode==='go'&&busy&&Math.hypot(dx,dy)<6){mode='punch';cat.classList.remove('run');cat.classList.add('punch');const a=busy;
  setTimeout(()=>impact(a),RM?0:300);setTimeout(()=>{cat.classList.remove('punch');busy=null;mode='idle';wanderT=0},RM?50:620)}
 requestAnimationFrame(tick)}
layoutCat();cx=30;cy=floorY();
spawn();spawn();setTimeout(spawn,300);
setInterval(()=>{if(!document.hidden)spawn()},2800);
addEventListener('resize',layoutAds);
if(document.fonts)document.fonts.ready.then(layoutAds);
applyLang();
ready=true;requestAnimationFrame(tick);
})();
