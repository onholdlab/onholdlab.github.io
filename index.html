<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>onholdlab 等候空間</title>
<meta name="description" content="onholdlab 等候空間：下一件作品，正在醞釀。一個人，用 AI 把想法做成作品。">
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" media="print" onload="this.media='all'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap"></noscript>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="wrap">
 <div class="top">
  <p class="lede" id="lede"></p>
  <div class="seg" id="seg" role="group" aria-label="Language"><button type="button" data-l="zh">繁中</button><button type="button" data-l="en">EN</button></div>
 </div>
 <h1 class="sr" id="h1"></h1>
 <p class="sr" id="tag"></p>

 <div class="stage" id="stage">
  <div class="stage-in">
  <svg id="scene" viewBox="0 0 640 400" preserveAspectRatio="xMidYMid slice" focusable="false" aria-hidden="true">
   <defs>
    <linearGradient id="gw" gradientUnits="userSpaceOnUse" x1="0" y1="-40" x2="0" y2="270"><stop offset="0" style="stop-color:var(--s-wall-a)"/><stop offset="1" style="stop-color:var(--s-wall-b)"/></linearGradient>
    <linearGradient id="gf" gradientUnits="userSpaceOnUse" x1="0" y1="262" x2="0" y2="430"><stop offset="0" style="stop-color:var(--s-floor-a)"/><stop offset="1" style="stop-color:var(--s-floor-b)"/></linearGradient>
    <radialGradient id="gl" cx=".5" cy=".5" r=".5"><stop offset="0" style="stop-color:var(--s-glow);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--s-glow);stop-opacity:0"/></radialGradient>
    <radialGradient id="gv" cx=".5" cy=".5" r=".72"><stop offset=".55" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#000" style="stop-opacity:var(--s-vig)"/></radialGradient>
    <clipPath id="wclip"><rect x="334" y="70" width="152" height="124" rx="4"/></clipPath>
   </defs>
   <g id="world">
    <!-- back wall + reserved empty space -->
    <g class="ly" style="--d:3">
     <rect x="-3000" y="-3000" width="9000" height="3270" fill="url(#gw)"/>
     <path class="fl" opacity=".18" d="M110 -3000V270M230 -3000V270M550 -3000V270M640 -3000V270M760 -3000V270M-10 -3000V270"/>
     <rect x="524" y="74" width="92" height="120" rx="4" fill="none" stroke="var(--s-line)" stroke-width="1.5" stroke-dasharray="4 7" opacity=".4"/>
    </g>
    <!-- floor -->
    <g class="ly" style="--d:5">
     <rect x="-3000" y="262" width="9000" height="3000" fill="url(#gf)"/>
     <path class="fl" opacity=".22" d="M320 262L-5832 1800M320 262L-4074 1800M320 262L-2518 1800M320 262L-1526 1800M320 262L-595 1800M320 262L1235 1800M320 262L2166 1800M320 262L3158 1800M320 262L4714 1800M320 262L6472 1800"/>
     <path class="fl" opacity=".14" d="M-3000 292H6000M-3000 328H6000M-3000 376H6000M-3000 440H6000M-3000 520H6000M-3000 630H6000M-3000 780H6000M-3000 960H6000"/>
    </g>
    <!-- window, counter -->
    <g class="ly" style="--d:7">
     <ellipse class="glowhalo" cx="410" cy="140" rx="150" ry="110" fill="url(#gl)"/>
     <rect x="326" y="62" width="168" height="140" rx="8" style="fill:var(--s-frame)"/>
     <rect x="334" y="70" width="152" height="124" rx="4" style="fill:var(--s-glow)"/>
     <rect x="368" y="108" width="44" height="58" rx="6" style="fill:var(--s-f2)" opacity=".9"/>
     <rect x="392" y="118" width="44" height="58" rx="6" style="fill:var(--s-f1)" opacity=".9"/>
     <g clip-path="url(#wclip)"><g class="shutter">
      <rect x="334" y="70" width="152" height="124" style="fill:var(--s-shutter)"/>
      <path d="M334 82H486M334 94H486M334 106H486M334 118H486M334 130H486M334 142H486M334 154H486M334 166H486M334 178H486" style="stroke:var(--s-frame)" stroke-width="1.2" opacity=".45" fill="none"/>
     </g></g>
     <rect class="sliver" x="338" y="190" width="144" height="3" rx="1.5" style="fill:var(--s-glow)"/>
     <ellipse cx="420" cy="272" rx="140" ry="9" fill="#000" opacity=".16"/>
     <rect x="296" y="198" width="248" height="14" rx="3" style="fill:var(--s-counter-top)"/>
     <rect x="300" y="212" width="240" height="56" style="fill:var(--s-counter)"/>
     <path d="M340 212V268M420 212V268M500 212V268" style="stroke:var(--s-frame)" stroke-width="1.2" opacity=".5" fill="none"/>
    </g>
    <!-- service bell -->
    <g class="ly" style="--d:9">
     <g class="bell" id="bell" role="button" tabindex="0" aria-pressed="false">
      <circle class="hint" cx="420" cy="188" r="22"/>
      <circle class="ring-focus" cx="420" cy="188" r="30"/>
      <ellipse cx="420" cy="199" rx="19" ry="4.5" style="fill:var(--s-frame)"/>
      <g class="bell-body">
       <path d="M403 198C403 176 437 176 437 198Z" style="fill:var(--s-bell)"/>
       <path d="M409 190C410 183 416 181 421 181" fill="none" style="stroke:var(--s-bell-hi)" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
       <rect x="417.5" y="173" width="5" height="4.5" rx="1.5" style="fill:var(--s-bell)"/>
      </g>
      <path class="wave" style="--wx:-6px" d="M397 178q-7 6-7 16"/>
      <path class="wave" style="--wx:6px" d="M443 178q7 6 7 16"/>
      <circle cx="420" cy="188" r="42" fill="transparent"/>
     </g>
    </g>
    <!-- queue: far to near -->
    <g class="ly" style="--d:12">
     <ellipse cx="262" cy="300" rx="22" ry="5" fill="#000" opacity=".2"/>
     <g class="fig" style="animation-delay:-1s"><rect x="248.5" y="260.3" width="27" height="39.7" rx="12" style="fill:var(--s-f1)"/>
      <circle class="head" cx="262" cy="253" r="8.3" style="fill:var(--s-h1)"/></g>
    </g>
    <g class="ly" style="--d:15">
     <ellipse cx="196" cy="322" rx="25" ry="5.5" fill="#000" opacity=".22"/>
     <g class="fig" style="animation-delay:-2.6s"><rect x="180.5" y="276.1" width="31" height="45.9" rx="14" style="fill:var(--s-f2)"/>
      <circle class="head" style="fill:var(--s-h2);animation-delay:-3s" cx="196" cy="267.5" r="9.6"/></g>
    </g>
    <g class="ly" style="--d:19">
     <ellipse cx="122" cy="346" rx="29" ry="6" fill="#000" opacity=".24"/>
     <g class="fig" style="animation-delay:-3.8s"><rect x="104" y="292.7" width="36" height="53.3" rx="16" style="fill:var(--s-f3)"/>
      <circle class="head" style="fill:var(--s-h3);animation-delay:-5s" cx="122" cy="282.7" r="11.2"/></g>
     <path d="M137 302Q150 304 158 313" fill="none" style="stroke:var(--s-f3)" stroke-width="6" stroke-linecap="round"/>
     <g class="glass">
      <path d="M152 291h12c0 9-3 14-6 14s-6-5-6-14z" style="fill:var(--s-glass)" opacity=".55"/>
      <path d="M153.2 296h9.6c-.3 6-2.3 8.6-4.8 8.6s-4.5-2.6-4.8-8.6z" style="fill:var(--s-wine)"/>
      <path d="M158 305v10M153 315.5h10" fill="none" style="stroke:var(--s-glass)" stroke-width="1.6" stroke-linecap="round"/>
     </g>
    </g>
    <!-- floating dust, nearest layer -->
    <g class="ly dust" style="--d:30">
     <circle cx="80" cy="120" r="2.2"/><circle cx="170" cy="70" r="1.6" style="animation-delay:-3s"/><circle cx="300" cy="150" r="2" style="animation-delay:-6s"/>
     <circle cx="540" cy="110" r="2.4" style="animation-delay:-2s"/><circle cx="590" cy="250" r="1.8" style="animation-delay:-8s"/><circle cx="470" cy="300" r="2.2" style="animation-delay:-5s"/>
     <circle cx="30" cy="260" r="1.8" style="animation-delay:-9s"/><circle cx="360" cy="40" r="1.6" style="animation-delay:-4s"/>
     <circle cx="-120" cy="90" r="2" style="animation-delay:-1s"/><circle cx="-60" cy="210" r="1.8" style="animation-delay:-7s"/><circle cx="660" cy="60" r="2" style="animation-delay:-10s"/>
     <circle cx="720" cy="190" r="2.2" style="animation-delay:-3.5s"/><circle cx="790" cy="120" r="1.6" style="animation-delay:-6.5s"/><circle cx="-170" cy="300" r="2" style="animation-delay:-2.5s"/>
    </g>
   </g>
   <rect class="vig" x="-200" y="-200" width="4000" height="3000" fill="url(#gv)"/>
  </svg>
  </div>
 </div>
 <div class="caption" id="caption" aria-live="polite"><span id="capt"></span><a id="caplink" hidden target="_blank" rel="noopener"></a></div>

 <div class="layout" id="layout">
  <aside id="wait" class="pane" aria-labelledby="hw">
   <h2><span id="hw"></span><small id="hws"></small></h2>
   <div class="wcards">
    <div class="wc">
     <span class="lbl" id="cdl"></span>
     <div class="cd" id="cd"><div><b>--</b><span></span></div><div><b>--</b><span></span></div><div><b>--</b><span></span></div><div><b>--</b><span></span></div></div>
     <p id="cdn"></p>
    </div>
    <div class="wc">
     <span class="pill" id="nvp"></span>
     <h3 id="nvt"></h3>
     <p id="nvd"></p>
    </div>
    <div class="wc">
     <span class="lbl" id="nxl"></span>
     <h3 id="nxt"></h3>
     <p id="nxd"></p>
     <form class="fb" id="fb" novalidate>
      <label class="vh" for="fbm" id="fbml"></label>
      <textarea id="fbm" rows="3" maxlength="2000" required></textarea>
      <label class="vh" for="fbc" id="fbcl"></label>
      <input id="fbc" type="text" maxlength="200" autocomplete="off">
      <div class="fbrow"><button type="submit" id="fbs"></button><span id="fbst" role="status" aria-live="polite"></span></div>
     </form>
     <a id="nxa" target="_blank" rel="noopener" href="https://github.com/onholdlab/tool-twins/issues"></a>
    </div>
   </div>
   <section class="demo" aria-labelledby="hdm">
    <h3 class="dh"><span id="hdm"></span><small id="hdms"></small></h3>
    <div class="dgrid" id="demo"></div>
   </section>
  </aside>

  <main id="done" class="pane" aria-labelledby="hd">
   <h2><span id="hd"></span><small id="hds"></small></h2>
   <h3 class="sub" id="hl"></h3>
   <div class="feature" id="feature"></div>
   <div class="slot" id="slot"></div>
   <h3 class="sub"><span id="hn"></span><small id="hns"></small></h3>
   <div class="grid" id="newgames"></div>
   <h3 class="sub" id="hg"></h3>
   <div class="grid" id="games"></div>
   <h3 class="sub" id="ht"></h3>
   <div class="grid" id="tools"></div>
  </main>
 </div>

 <section class="facts-sec" aria-labelledby="hf"><h2 id="hf"></h2><div class="facts" id="facts"></div></section>
 <footer><span id="copy">© 2026 onholdlab</span><span id="foot"></span><span id="petnote"></span></footer>
</div>
<div class="pet" id="pet" aria-hidden="true"></div>

<script src="data/projects.js"></script>
<script src="js/feedback.js"></script>
<script src="js/app.js"></script>
</body>
</html>
