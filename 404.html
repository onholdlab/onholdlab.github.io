<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>找不到這一頁｜onholdlab</title>
<style>
html,body{margin:0;height:100%}
body{background:#d7e7df;color:#12302a;font:16px/1.6 system-ui,-apple-system,"Noto Sans TC","PingFang TC",sans-serif;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;box-sizing:border-box}
.n{font-size:72px;font-weight:900;letter-spacing:.06em;color:#c2281d;line-height:1}
h1{font-size:20px;margin:16px 0 4px}
p{margin:0 0 20px;opacity:.8}
a{font-weight:700;color:#c2281d;text-decoration:none}
:focus-visible{outline:none;color:#12302a}
</style>
</head>
<body>
<main>
  <div class="n">404</div>
  <h1 id="t">這一頁不在等候空間裡</h1>
  <p id="d">網址可能打錯了，或作品已經搬家。</p>
  <a id="h" href="/">回到 onholdlab 首頁</a>
</main>
<script>
if(!(navigator.language||'').toLowerCase().startsWith('zh')){
  document.documentElement.lang='en';
  document.title='Page not found | onholdlab';
  document.getElementById('t').textContent='This page is not in the waiting room';
  document.getElementById('d').textContent='The address may be mistyped, or the work has moved.';
  document.getElementById('h').textContent='Back to the onholdlab home page';
}
</script>
</body>
</html>
