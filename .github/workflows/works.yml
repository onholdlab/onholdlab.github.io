name: 更新作品清單
on:
  schedule:
    - cron: '17 */6 * * *'   # 每 6 小時
  workflow_dispatch:          # 也可以在 Actions 頁面手動按 Run
  push:
    branches: [main]
    paths: ['scripts/build-works.mjs', '.github/workflows/works.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-works.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 有變動才 commit
        run: |
          if git diff --quiet -I '"updated"' -- works.json 2>/dev/null && git ls-files --error-unmatch works.json >/dev/null 2>&1; then
            echo "沒有變動"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add works.json
          git commit -m "更新作品清單"
          git push
